version: '3'

services:

  mongodb:
    image: mongo:latest
    container_name: "mongodb"
    hostname: mongodb-host
    environment:
      - MONGO_INITDB_DATABASE=management-tool
    ports:
      - "27017:27017"
    networks:
      - management-tool-network
    volumes:
      - ./data/init-mongo.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

networks:
  management-tool-network:
    driver: bridge